<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Lupa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <!-- ľavý stĺpec má šírku stromu (--tree-w), hľadanie je presne nad zoznamom (po --detail-w) -->
  <div class="brand left-col">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.8-4.8"></path></svg>
    <span class="brand-name">Lupa</span>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <label for="q" class="sr-only">Hľadať</label>
    <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Číslo výkresu, názov súboru, napr. 3674 alebo cnc_vyk*.pdf  (Ctrl+F)" title="Viac slov = všetky musia sedieť. * = ľubovoľný text, ? = jeden znak (vtedy platí pre celý názov).">
    <button type="button" class="search-clear" id="qClear" aria-label="Vymazať hľadanie" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>
</header>

<div class="filterbar">
  <div class="left-col tree-tools">
    <span class="flabel">Zákazníci</span>
    <button type="button" class="iconbtn" id="treeExpand" title="Rozbaliť všetkých zákazníkov" aria-label="Rozbaliť všetkých zákazníkov">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
    </button>
    <button type="button" class="iconbtn" id="treeCollapse" title="Zbaliť celý strom" aria-label="Zbaliť celý strom">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 20 5-5 5 5"></path><path d="m7 4 5 5 5-5"></path></svg>
    </button>
  </div>
  <button type="button" class="chip-select views-btn" id="viewsBtn" aria-haspopup="menu" title="Moje filtre – vlastník, typy, hľadanie, rozsah a zobrazenie naraz">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
    <span id="viewsLabel">Moje filtre</span>
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <button type="button" class="chip-select" id="ownerChip" aria-haspopup="listbox" aria-expanded="false" title="Vlastník súboru (kto ho vytvoril)">
    <span>Vlastník:</span>
    <span class="cs-value" id="ownerValue">Všetci</span>
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <div class="fgroup" role="group" aria-label="Typ súboru">
    <span class="flabel">Typ</span>
    <div id="chips" class="chips"></div>
    <button type="button" class="linkbtn" id="chipsAll" title="Zapnúť všetky typy">všetky</button>
    <span class="sep">|</span>
    <button type="button" class="linkbtn" id="chipsNone" title="Vypnúť všetky typy – potom si naklikaj, ktoré chceš">žiadne</button>
  </div>
  <div class="seg" role="group" aria-label="Rozsah">
    <button type="button" data-scope="job" id="scopeJob">Aktuálna zákazka</button>
    <button type="button" data-scope="all" id="scopeAll">Celé L:\</button>
  </div>
</div>

<div class="layout">
  <nav class="tree-pane" aria-label="Zákazníci a zákazky">
    <div id="tree" class="tree" role="tree" tabindex="0"></div>
  </nav>
  <div class="resizer" data-pane="tree" title="Ťahaním zmeníš šírku"></div>

  <main class="list-pane">
    <div class="list-head">
      <div>
        <div class="crumb mono" id="crumb"></div>
        <div class="head-row">
          <h1 id="heading">Vyber zákazku</h1>
          <div class="compl" id="compl" hidden></div>
          <div class="machines" id="machines" hidden></div>
        </div>
        <div class="links" id="links" hidden></div>
      </div>
      <div class="head-right">
        <!-- len CNC listy (zapína ho filter „Moje CNC listy“), ✕ = vypnúť -->
        <button type="button" class="lists-badge" id="listsBadge" hidden
          title="Len CNC listy: Excel; Word a PDF s „cnc“, „programový list“ alebo „poloha“ v mene, alebo v priečinku „CNC listy“ (lupa.ini). Klik = vypnúť.">
          CNC listy
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
        <span class="count" id="count"></span>
        <div class="viewsw" role="group" aria-label="Zobrazenie">
          <button type="button" data-mode="list" id="modeList" title="Zoznam (Ctrl+G prepína)" aria-label="Zoznam"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"></path><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3"></path></svg></button>
          <button type="button" data-mode="gallery" id="modeGallery" title="Galéria (Ctrl+G prepína)" aria-label="Galéria"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg></button>
        </div>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <table class="files" id="files">
        <thead>
          <tr>
            <th data-sort="ftype" class="c-type">Typ</th>
            <th data-sort="sim" class="c-sim" title="Podobnosť výkresu s hľadaným (tvar pohľadov)">Podobnosť</th>
            <th data-sort="name" class="c-name">Názov</th>
            <th data-sort="folder" class="c-folder">Priečinok</th>
            <th data-sort="owner" class="c-owner">Vlastník</th>
            <th data-sort="created" class="c-date k-created">Vytvorený</th>
            <th data-sort="modified" class="c-date k-modified">Zmenený</th>
            <th data-sort="size" class="c-size">Veľkosť</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="gallery-wrap" id="galleryWrap" hidden>
      <div class="gal-tools">
        <label for="galSort" class="flabel">Triediť</label>
        <select id="galSort">
          <option value="sim:-1" id="galSortSim" hidden>Podobnosť</option>
          <option value="modified:-1">Zmenený – najnovšie</option>
          <option value="modified:1">Zmenený – najstaršie</option>
          <option value="name:1">Názov</option>
          <option value="ftype:1">Typ</option>
          <option value="folder:1">Priečinok</option>
          <option value="size:-1">Veľkosť</option>
        </select>
        <label for="galSize" class="flabel" style="margin-left:16px">Veľkosť</label>
        <input type="range" id="galSize" min="120" max="420" step="10" value="220">
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
    <div class="empty" id="empty">Vľavo vyber zákazku alebo priečinok.</div>
  </main>
  <div class="resizer" data-pane="detail" title="Ťahaním zmeníš šírku"></div>

  <aside class="detail-pane" aria-label="Detail súboru">
    <div id="detail" class="detail">
      <div class="detail-empty">Klikni na súbor pre detail.<br>Dvojklik ukáže súbor v strome.</div>
    </div>
  </aside>
</div>

<footer class="statusbar">
  <div class="st-progress" id="stProgress" hidden><div id="stProgressBar"></div></div>
  <span id="stLeft"></span>
  <span class="st-right">
    <span id="stUpdate"></span>
    <span id="stRight"></span>
    <button type="button" class="st-btn" id="stReload" title="Načítať znova údaje z databázy (F5)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 4v5h-5"></path></svg>
      <span id="stReloadText">Obnoviť</span>
    </button>
  </span>
</footer>

<div class="toast" id="toast" role="alert" hidden></div>

<!-- uloženie aktuálneho filtra (Moje filtre) -->
<div class="dlg-back" id="viewDlg" hidden>
  <form class="dlg" id="viewForm" autocomplete="off">
    <div class="dlg-title">Uložiť aktuálny filter</div>
    <div class="dlg-sum" id="viewSum"></div>
    <label for="viewName" class="dlg-label">Názov</label>
    <input id="viewName" type="text" maxlength="40" spellcheck="false" placeholder="napr. Moje Op10 listy">
    <div class="dlg-hint">Rovnaký názov prepíše existujúci filter.</div>
    <div class="dlg-btns">
      <button type="button" class="btn" id="viewCancel">Zrušiť</button>
      <button type="submit" class="btn primary">Uložiť</button>
    </div>
  </form>
</div>
<div class="ctx" id="ctx" role="menu" hidden></div>
<div class="fmenu" id="fmenu" role="listbox" aria-label="Nájdené zákazky a zákazníci" hidden></div>
<style id="colHide"></style>
<div class="dropdown" id="ownerDrop" hidden>
  <div class="dd-search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input type="text" id="ownerFilter" placeholder="Hľadať meno…" autocomplete="off" spellcheck="false" aria-label="Hľadať vlastníka">
  </div>
  <div class="dd-list" id="ownerList" role="listbox"></div>
</div>

<script src="app.js"></script>
</body>
</html>
